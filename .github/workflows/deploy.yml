name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/sha) to deploy'
        required: true
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dxt:
    name: Build & attach DXT
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    # Only attach to a real release. `workflow_dispatch` builds for sanity-
    # check; the artifact is still uploaded so it can be downloaded manually.
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:dxt
      - name: Upload DXT artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bx24-template-mcp-dxt
          path: dist/bx24-template-mcp.dxt
          if-no-files-found: error
      - name: Attach DXT to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b25b93d384199fc0fc8c2e126b2d937a0cbeb2ae # v2.5.2
        with:
          files: dist/bx24-template-mcp.dxt
          fail_on_unmatched_files: true

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ vars.PROD_HOST }}
    # Bind admin-controlled `vars.*` to env once at job level. The two SSH
    # steps forward `DEPLOY_PATH` into the remote shell via appleboy/ssh-
    # action's `envs:` parameter; the health-check step reads `PROD_HOST`
    # directly. Keeping `${{ … }}` out of every `run:` / `script:` block is
    # the same defence-in-depth shim used in `ci.yml` (see CONTRIBUTING.md
    # "CI authoring rule" and #171 / #172).
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bx24-template-mcp' }}
      PROD_HOST: ${{ vars.PROD_HOST }}
    steps:
      - name: SSH — pull & up
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # `envs:` proxies the named env-vars from the runner into the SSH
          # session — appleboy/ssh-action injects `export VAR=value` at the
          # head of `script:` rather than relying on the SSH protocol's
          # `SendEnv` (which would need `AcceptEnv DEPLOY_PATH` in sshd_config).
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            : "${DEPLOY_PATH:?DEPLOY_PATH is empty — envs: forwarding failed}"
            cd "$DEPLOY_PATH"
            # Capture the image digest of the currently running container so the
            # rollback step can pin it via BX24_IMAGE. `docker inspect <container>`
            # exposes the image ID via .Image; only the image's own inspect
            # carries .RepoDigests. Overwrite (not append) so we always hold the
            # last-known-good ref, not the very first deploy's.
            CURRENT_DIGEST=""
            IMAGE_ID=$(docker container inspect --format='{{.Image}}' bx24-template-mcp 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ]; then
              CURRENT_DIGEST=$(docker image inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$IMAGE_ID" 2>/dev/null || true)
            fi
            echo "previous=$CURRENT_DIGEST" > rollback.env
            # Restrict file to deploy-user only (root cause: write-race
            # window between deploy and rollback). The regex check on the
            # read side is defence-in-depth; this `chmod` is the actual
            # fence — a co-tenant process on the prod host can no longer
            # ghostwrite `previous=` without owning the deploy UID.
            chmod 0600 rollback.env
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Health check
        id: health
        run: |
          : "${PROD_HOST:?PROD_HOST is not set — configure vars.PROD_HOST}"
          URL="https://$PROD_HOST/api/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$URL" >/dev/null; then
              echo "Healthy after attempt $i."
              exit 0
            fi
            echo "Attempt $i/10 failed, sleeping 3s…"
            sleep 3
          done
          echo "Health check failed after 10 attempts." >&2
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            : "${DEPLOY_PATH:?DEPLOY_PATH is empty — envs: forwarding failed}"
            cd "$DEPLOY_PATH"
            if [ ! -f rollback.env ]; then
              echo "rollback.env missing — manual rollback required." >&2
              exit 1
            fi
            # `head -c 4096` caps input length (a legit `previous=…@sha256:…`
            # line is ~80 bytes — 4 KiB is generous but bounds memory if the
            # file is ever pathologically large). `head -n1` (not `tail`) of
            # the matches: a write-race that appends a line after our own
            # write should not promote the appended value over the
            # legitimately-recorded one.
            PREV=$(head -c 4096 rollback.env | grep '^previous=' | head -n1 | cut -d= -f2-)
            if [ -z "$PREV" ]; then
              echo "No previous image recorded — manual rollback required." >&2
              exit 1
            fi
            # `rollback.env` lives on the production host filesystem. The
            # "SSH — pull & up" step above writes it `chmod 0600`, so a
            # co-tenant process can no longer rewrite `previous=` without
            # owning the deploy UID — that is the actual fence. This regex
            # is defence-in-depth: even with file ownership compromised, an
            # attacker-chosen image ref still has to survive a strict charset
            # gate before reaching `docker pull` / `BX24_IMAGE=…`.
            #
            # Charset: a legal Docker reference is
            # `<registry>[:port]/<repo>[:tag][@sha256:<digest>]`, which uses
            # only `[A-Za-z0-9._/:@-]`. The first character must be
            # alphanumeric to deny refs that look like CLI flags (`-rf`,
            # `--disable-content-trust`) — `docker pull "$PREV"` quotes the
            # value but `docker pull` itself still parses leading `-` as a
            # flag. Belt-and-braces: we also pass `--` below.
            #
            # Known limitations (acknowledged, NOT bugs):
            #   * SemVer build metadata (`+`) — not in the Docker tag
            #     spec; refs we generate via `docker/metadata-action`
            #     with `type=semver,pattern={{version}}` strip it.
            #   * IPv6 registry hosts (`[2001:db8::1]:5000/repo`) —
            #     `[`/`]` excluded; legal per OCI but unused here
            #     (we publish to ghcr.io).
            #   * This is a CHARSET check, NOT authenticity. A
            #     legitimate-looking attacker ref (`evil.example.com/img`)
            #     still passes — that class is the underlying file-ownership
            #     control above, not this regex.
            if ! printf '%s' "$PREV" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/:@-]*$'; then
              echo "Unexpected characters in recorded previous image — aborting rollback." >&2
              echo "Got: $PREV" >&2
              exit 1
            fi
            echo "Rolling back to $PREV"
            # `--` ends option parsing — redundant with the alnum-first regex
            # anchor above but cheap and idiomatic for any `docker pull`
            # receiving a value that ultimately comes from disk.
            docker pull -- "$PREV"
            # docker-compose.yml uses image: ${BX24_IMAGE:-…:latest}, so
            # exporting BX24_IMAGE pins the previous digest without rewriting
            # any files on disk.
            BX24_IMAGE="$PREV" docker compose up -d --remove-orphans
