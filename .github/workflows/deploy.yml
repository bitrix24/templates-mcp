name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/sha) to deploy'
        required: true
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ vars.PROD_HOST }}
    steps:
      - name: SSH — pull & up
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/opt/bx24-template-mcp' }}"
            # Capture the image digest of the currently running container so the
            # rollback step can pin it via BX24_IMAGE. `docker inspect <container>`
            # exposes the image ID via .Image; only the image's own inspect
            # carries .RepoDigests. Overwrite (not append) so we always hold the
            # last-known-good ref, not the very first deploy's.
            CURRENT_DIGEST=""
            IMAGE_ID=$(docker container inspect --format='{{.Image}}' bx24-template-mcp 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ]; then
              CURRENT_DIGEST=$(docker image inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$IMAGE_ID" 2>/dev/null || true)
            fi
            echo "previous=$CURRENT_DIGEST" > rollback.env
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Health check
        id: health
        run: |
          URL="https://${{ vars.PROD_HOST }}/api/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$URL" >/dev/null; then
              echo "Healthy after attempt $i."
              exit 0
            fi
            echo "Attempt $i/10 failed, sleeping 3s…"
            sleep 3
          done
          echo "Health check failed after 10 attempts." >&2
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/opt/bx24-template-mcp' }}"
            if [ ! -f rollback.env ]; then
              echo "rollback.env missing — manual rollback required." >&2
              exit 1
            fi
            PREV=$(grep '^previous=' rollback.env | tail -n1 | cut -d= -f2-)
            if [ -z "$PREV" ]; then
              echo "No previous image recorded — manual rollback required." >&2
              exit 1
            fi
            echo "Rolling back to $PREV"
            docker pull "$PREV"
            # docker-compose.yml uses image: ${BX24_IMAGE:-…:latest}, so
            # exporting BX24_IMAGE pins the previous digest without rewriting
            # any files on disk.
            BX24_IMAGE="$PREV" docker compose up -d --remove-orphans
