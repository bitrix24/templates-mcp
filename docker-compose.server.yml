# Reverse-proxy stack: nginx-proxy + Let's Encrypt acme-companion.
#
# Run this ONCE on the host before starting the application:
#   make init-network
#   make server-up
#
# After that, every container that declares VIRTUAL_HOST / LETSENCRYPT_HOST
# on the proxy-net network gets TLS served automatically.
#
# See docs/REVERSE-PROXY.md for alternative TLS terminators (Caddy, Traefik,
# plain nginx + certbot) and docs/DEPLOYMENT.md for the full host setup guide.

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - dhparam:/etc/nginx/dhparam
      - certs:/etc/nginx/certs:ro
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy-net
    restart: always

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    networks:
      - proxy-net
    restart: always

volumes:
  conf:
  vhost:
  dhparam:
  certs:
  html:
  acme:

networks:
  proxy-net:
    driver: bridge
    external: true
