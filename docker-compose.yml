services:
  bx24-template-mcp:
    # BX24_IMAGE lets operators pin a specific tag/digest (e.g. for rollback).
    # Default is :latest, which is what GH Actions pushes on every v* tag.
    image: ${BX24_IMAGE:-ghcr.io/bitrix24/templates-mcp:latest}
    container_name: bx24-template-mcp
    restart: always
    # Hardening: drop all Linux capabilities (the Node server binds an
    # unprivileged port and runs as USER node, so it needs none) and forbid
    # privilege escalation via setuid binaries. `read_only` is intentionally
    # NOT set — the audit logger appends JSONL under /data/audit at runtime.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # Watchtower: only update containers that carry this label (--label-enable).
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      NUXT_BITRIX24_WEBHOOK_URL: ${NUXT_BITRIX24_WEBHOOK_URL}
      NUXT_MCP_AUTH_TOKEN: ${NUXT_MCP_AUTH_TOKEN}
      NUXT_GITHUB_FEEDBACK_TOKEN: ${NUXT_GITHUB_FEEDBACK_TOKEN}
      NUXT_GITHUB_FEEDBACK_REPO: ${NUXT_GITHUB_FEEDBACK_REPO:-bitrix24/templates-mcp}
      NUXT_LOG_LEVEL: ${NUXT_LOG_LEVEL}
      NITRO_PORT: ${NITRO_PORT}
      NODE_ENV: ${NODE_ENV}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - proxy-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  watchtower:
    # Polls GHCR every 5 minutes and restarts only containers labelled
    # com.centurylinklabs.watchtower.enable=true (--label-enable).
    # Removes old images after update (--cleanup).
    # Pin to a specific release — never use :latest for infrastructure.
    # Check for latest at: https://github.com/containrrr/watchtower/releases
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Docker Engine 24+ uses API 1.47; Watchtower 1.7.x needs this hint.
      DOCKER_API_VERSION: "1.47"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
