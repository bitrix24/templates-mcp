allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

# Pinned transitive dependency versions to remediate Dependabot/security
# advisories. pnpm v11 reads overrides from pnpm-workspace.yaml (the
# package.json "pnpm" field is no longer honored).
overrides:
  # GHSA-52f5-9888-hmc6 — arbitrary temp file write via symlink (tmp <0.2.6)
  tmp: '>=0.2.6'
  # GHSA-5v7r-6r5c-r473 — infinite loop in ASF parser (file-type <21.3.1)
  file-type: '>=21.3.1'
  # GHSA-pr96-94w5-mx2h — path traversal in directory listing (@fastify/static <=9.1.0)
  '@fastify/static': '>=9.1.1'
  # GHSA-6rw7-vpxm-498p — arrayLimit bypass DoS via memory exhaustion (qs <=6.15.1)
  qs: '>=6.15.2'
