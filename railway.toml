# Railway deployment manifest. Railway builds from the repo's Dockerfile,
# which already targets the same production image we ship via the
# nginx-proxy / acme-companion stack — there is no Railway-specific build.
#
# Required environment variables (set in the Railway dashboard at deploy
# time; the one-click "Deploy on Railway" button prompts for them):
#   - NUXT_BITRIX24_WEBHOOK_URL  : your portal's inbound webhook URL
#   - NUXT_MCP_AUTH_TOKEN        : openssl rand -hex 32
#   - NUXT_GITHUB_FEEDBACK_TOKEN : optional; enables bx24mcp_submit_feedback
#   - NUXT_GITHUB_FEEDBACK_REPO  : optional; defaults to bitrix24/templates-mcp
#
# Health check: Railway hits /api/health (unauthenticated) and rolls back on
# non-200. The endpoint is intentionally lightweight — see
# server/api/health.get.ts.

[build]
builder = "DOCKERFILE"

[deploy]
# Explicit start command matching the Dockerfile CMD. Railway honours the
# image CMD by default, but pinning it here keeps the deploy working if the
# base image's entrypoint ever changes.
startCommand = "node .output/server/index.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Required at deploy time. Railway prompts for variables declared here when the
# one-click button is used, so an evaluator can't deploy a half-configured
# server. Values are NOT committed — these are placeholders the dashboard fills.
[variables]
NUXT_BITRIX24_WEBHOOK_URL = { description = "Your portal's inbound webhook URL: https://<portal>.bitrix24.com/rest/<user-id>/<code>/", required = true }
NUXT_MCP_AUTH_TOKEN = { description = "Bearer token MCP clients must present. Generate via: openssl rand -hex 32", required = true }
NUXT_GITHUB_FEEDBACK_TOKEN = { description = "Optional. Fine-grained GitHub PAT (Issues: read/write) that enables bx24mcp_submit_feedback.", required = false }
NUXT_GITHUB_FEEDBACK_REPO = { description = "Optional. owner/name for feedback issues. Defaults to bitrix24/templates-mcp.", required = false }
